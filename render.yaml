# Render Blueprint (Static Site): New + > Blueprint > pilih repo ini. Tiada pelayan backend diperlukan.
services:
  - type: web
    name: generali-oneform
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite        # /apply, /agent dsb. tidak 404 bila di-refresh
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /sw.js
        name: Cache-Control
        value: no-cache
